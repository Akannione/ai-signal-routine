  <text x="78" y="124" fill="#5d6b67" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">SQLite history and CSV exports translated into an operating review for analytics, automation, and AI operations roles.</text>
  <rect x="1098" y="67" width="220" height="40" rx="20" fill="#eff5ec" stroke="#cfd9cb"/>
  <text x="1130" y="92" fill="#355642" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Public-safe sample data</text>

