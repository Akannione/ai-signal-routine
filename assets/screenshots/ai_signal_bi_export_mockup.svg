    <text x="350" y="243" fill="#2d2920" font-size="44" font-weight="700">100%</text>

    <rect x="578" y="160" width="230" height="112" rx="8" fill="#edf6f9" stroke="#cce2e8"/>
    <text x="600" y="196" fill="#42616b" font-size="14">Open actions</text>
    <text x="600" y="243" fill="#1e3841" font-size="44" font-weight="700">4</text>

