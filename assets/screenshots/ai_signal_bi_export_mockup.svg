    <text x="118" y="770" fill="#2e7d76" font-size="13" font-weight="700">test</text>
    <text x="220" y="770" fill="#26312f" font-size="13">SQL quality checks</text>
    <text x="492" y="770" fill="#26312f" font-size="13">Business Ops Reporting</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
