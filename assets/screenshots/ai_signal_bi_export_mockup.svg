<svg width="1400" height="900" viewBox="0 0 1400 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AI Signal Routine BI Export Mockup</title>
  <desc id="desc">A BI style dashboard mockup showing weekly signal review metrics, decision mix, source quality, theme radar, and open actions from exported CSV files.</desc>
  <rect width="1400" height="900" fill="#f7f8f4"/>
  <rect x="42" y="36" width="1316" height="828" rx="10" fill="#ffffff" stroke="#d8ded4"/>

