    <text x="620" y="522" fill="#66716f" font-size="12">Analytics</text>
    <text x="695" y="522" fill="#66716f" font-size="12">Auto</text>
    <text x="754" y="522" fill="#66716f" font-size="12">Bench</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="918" y="306" width="400" height="232" rx="8" fill="#ffffff" stroke="#d8ded4"/>
