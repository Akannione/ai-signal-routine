    <line x1="762" y1="680" x2="762" y2="760" stroke="#d4dad6"/>
    <polyline points="780,742 890,724 1000,714 1110,694 1220,674" fill="none" stroke="#174c43" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="780" cy="742" r="5" fill="#174c43"/>
    <circle cx="890" cy="724" r="5" fill="#174c43"/>
    <circle cx="1000" cy="714" r="5" fill="#174c43"/>
    <circle cx="1110" cy="694" r="5" fill="#174c43"/>
    <circle cx="1220" cy="674" r="5" fill="#174c43"/>
    <text x="762" y="792" fill="#66716f" font-size="12">Run 1</text>
    <text x="1200" y="792" fill="#66716f" font-size="12">Latest</text>
